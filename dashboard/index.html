<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>依声游理 · 校园数据大屏</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/1.7.2/cloudbase.full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --blue: #4A90D9;
    --blue-lt: #7FC0FF;
    --gold: #F5C26B;
    --ink: #EAF2FA;
    --dim: #8FA8C4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #0d2a4a 0%, #071a33 55%, #050e1e 100%);
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  /* 北理工 1940 水印 */
  body::after {
    content: "1940";
    position: fixed;
    right: -30px;
    bottom: -40px;
    font-size: 220px;
    font-weight: 900;
    color: rgba(74, 144, 217, 0.06);
    z-index: 0;
    pointer-events: none;
  }
  header {
    height: 84px;
    display: flex;
    align-items: center;
    padding: 0 34px;
    background: linear-gradient(180deg, rgba(13,42,74,0.95), rgba(13,42,74,0.4));
    border-bottom: 1px solid rgba(74,144,217,0.35);
    box-shadow: 0 0 40px rgba(74,144,217,0.15);
    position: relative;
    z-index: 2;
  }
  header .logo {
    width: 52px; height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(245,194,107,0.8);
    box-shadow: 0 0 16px rgba(245,194,107,0.4);
    margin-right: 16px;
    background: #fff;
  }
  header h1 {
    font-size: 30px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffffff, var(--blue-lt));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header .sub {
    font-size: 13px;
    color: var(--dim);
    margin-left: 18px;
    letter-spacing: 1px;
    border-left: 1px solid rgba(255,255,255,0.15);
    padding-left: 18px;
  }
  header .right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .time { font-size: 14px; color: var(--dim); }
  header .badge {
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid rgba(127,192,255,0.5);
    color: var(--blue-lt);
    background: rgba(74,144,217,0.15);
  }
  header .badge.demo {
    border-color: rgba(245,194,107,0.6);
    color: var(--gold);
    background: rgba(245,194,107,0.12);
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 22px 34px 0;
    position: relative;
    z-index: 2;
  }
  .metric {
    background: linear-gradient(135deg, rgba(74,144,217,0.12), rgba(74,144,217,0.03));
    border: 1px solid rgba(74,144,217,0.3);
    border-radius: 14px;
    padding: 18px 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
  }
  .metric::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--blue-lt), transparent);
  }
  .metric .label {
    font-size: 14px;
    color: var(--dim);
    letter-spacing: 1px;
  }
  .metric .value {
    font-size: 40px;
    font-weight: 800;
    margin-top: 8px;
    font-family: "DIN Alternate", "Arial Black", sans-serif;
    text-shadow: 0 0 20px rgba(127,192,255,0.5);
  }
  .metric .value small { font-size: 18px; color: var(--dim); font-weight: 400; margin-left: 4px; }
  .metric .icon { position: absolute; right: 18px; top: 16px; font-size: 34px; opacity: 0.5; }
  .metric.gold { border-color: rgba(245,194,107,0.45); }
  .metric.gold .value { text-shadow: 0 0 20px rgba(245,194,107,0.5); }

  main {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 20px;
    padding: 20px 34px;
    height: calc(100vh - 84px - 140px);
    position: relative;
    z-index: 2;
  }
  .panel {
    background: rgba(10,28,52,0.6);
    border: 1px solid rgba(74,144,217,0.25);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .panel .p-title {
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel .p-title::before {
    content: "";
    width: 4px; height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--blue-lt), var(--blue));
  }
  .panel .p-title .hint { margin-left: auto; font-size: 12px; color: var(--dim); letter-spacing: 0; }

  /* 最近打卡滚动 */
  .feed {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .feed-item {
    background: rgba(74,144,217,0.08);
    border: 1px solid rgba(74,144,217,0.2);
    border-left: 3px solid var(--blue);
    border-radius: 10px;
    padding: 10px 14px;
    animation: slideIn 0.5s ease both;
  }
  .feed-item .who { font-size: 13px; color: var(--blue-lt); font-weight: 600; }
  .feed-item .what { font-size: 14px; color: var(--ink); margin-top: 3px; }
  .feed-item .what .spell { color: var(--gold); font-style: italic; }
  .feed-item .when { font-size: 11px; color: var(--dim); margin-top: 3px; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

  /* 排行榜 */
  .rank-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 10px;
    background: rgba(74,144,217,0.06);
    border: 1px solid rgba(74,144,217,0.15);
  }
  .rank-row.top3 { border-color: rgba(245,194,107,0.5); background: rgba(245,194,107,0.07); }
  .rank-row .no {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    background: rgba(255,255,255,0.08);
    color: var(--dim);
    flex-shrink: 0;
  }
  .rank-row.top3 .no { background: linear-gradient(135deg, #F5C26B, #E0A84A); color: #3A2400; }
  .rank-row .name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .rank-row .count { font-size: 18px; font-weight: 700; color: var(--blue-lt); font-family: "DIN Alternate", sans-serif; }
  .rank-row .unit { font-size: 11px; color: var(--dim); }

  .chart-box { flex: 1; min-height: 0; }
  #heatChart, #routeChart { width: 100%; height: 100%; }

  footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 1px;
    background: rgba(5,14,30,0.7);
    border-top: 1px solid rgba(74,144,217,0.15);
    z-index: 2;
  }
  footer .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #35D07F; margin-right: 8px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

<header>
  <img class="logo" src="../code/code/images/bit-logo.png" alt="校徽" />
  <h1>依声游理 · 校园数据大屏</h1>
  <div class="sub">北京理工大学 · 声控打卡游戏 · 实时数据</div>
  <div class="right">
    <div class="time" id="updateTime">--:--:--</div>
    <div class="badge" id="dataMode">实时数据</div>
  </div>
</header>

<section class="metrics">
  <div class="metric">
    <div class="icon">🗓️</div>
    <div class="label">今日打卡</div>
    <div class="value" id="mToday">--</div>
  </div>
  <div class="metric gold">
    <div class="icon">🏆</div>
    <div class="label">累计打卡</div>
    <div class="value" id="mTotal">--</div>
  </div>
  <div class="metric">
    <div class="icon">🧑‍🎓</div>
    <div class="label">活跃玩家</div>
    <div class="value" id="mUsers">--</div>
  </div>
  <div class="metric">
    <div class="icon">📍</div>
    <div class="label">已点亮 / 总点位</div>
    <div class="value" id="mPoints">--</div>
  </div>
</section>

<main>
  <div class="panel">
    <div class="p-title">点位热度 <span class="hint">成功打卡次数 TOP</span></div>
    <div class="chart-box" id="heatChart"></div>
  </div>

  <div class="panel">
    <div class="p-title">实时打卡 <span class="hint">最近动态</span></div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="panel">
    <div class="p-title">打卡次数榜 <span class="hint">TOP 10</span></div>
    <div class="rank-list" id="rank"></div>
    <div class="p-title" style="margin-top:14px;">剧本任务线完成率</div>
    <div class="chart-box" id="routeChart"></div>
  </div>
</main>

<footer><span class="dot"></span>依声游理 · 德以明理 学以精工 · 数据每 30 秒自动刷新</footer>

<script>
// ============================================================
// 1) 数据源配置（免费方案：云开发 Web SDK 匿名登录直连云函数，不需要 HTTP 访问服务/充值）
//    - 环境 ID 填你的：cloud1-d2gled32od1bdcb02
//    - 需在云开发控制台「环境 → 登录方式」开启「匿名登录」（免费）
//    - 需把 getDashboardData 云函数权限设为「所有用户可调用」
//    - 全部失败时自动展示演示数据（右上角标注「演示数据」），答辩不翻车
const CLOUD_ENV = 'cloud1-d2gled32od1bdcb02';
const REFRESH_MS = 30000;
// ============================================================

const demo = {
  totalCheckins: 486, todayCheckins: 37, activeUsers: 96, totalPoints: 12, litPoints: 9,
  recentCheckins: [
    { nickname: 'C₆H₁₂', pointName: '文萃楼B', spell: '我爱文萃', time: new Date(Date.now() - 90 * 1000) },
    { nickname: '小张同学', pointName: '综教楼A', spell: '延安根军工魂', time: new Date(Date.now() - 5 * 60 * 1000) },
    { nickname: '自动化er', pointName: '文博中心', spell: '明德精工', time: new Date(Date.now() - 18 * 60 * 1000) },
    { nickname: '北理之声', pointName: '甘棠园7D', spell: '学以精工', time: new Date(Date.now() - 42 * 60 * 1000) },
    { nickname: '夜跑星人', pointName: '中心花园', spell: '听风', time: new Date(Date.now() - 1.2 * 3600 * 1000) },
    { nickname: '签到狂魔', pointName: '文萃楼B', spell: '我爱文萃', time: new Date(Date.now() - 2 * 3600 * 1000) },
    { nickname: '老四', pointName: '甘棠园7D', spell: '我爱甘棠', time: new Date(Date.now() - 3 * 3600 * 1000) }
  ],
  rankingTop: [
    { rank: 1, nickname: 'C₆H₁₂', count: 58 }, { rank: 2, nickname: '小张同学', count: 49 },
    { rank: 3, nickname: '自动化er', count: 41 }, { rank: 4, nickname: '北理之声', count: 36 },
    { rank: 5, nickname: '夜跑星人', count: 30 }, { rank: 6, nickname: '签到狂魔', count: 27 },
    { rank: 7, nickname: '老四', count: 22 }, { rank: 8, nickname: '新玩家', count: 15 }
  ],
  routeStats: { totalRoutes: 1, participants: 32, completed: 11, rate: 34 },
  pointHeat: [
    { name: '文萃楼B', count: 132 }, { name: '甘棠园7D', count: 104 }, { name: '综教楼A', count: 87 },
    { name: '文博中心', count: 76 }, { name: '中心花园', count: 42 }, { name: '图书馆', count: 31 },
    { name: '校史馆', count: 14 }
  ]
};

const $id = (s) => document.getElementById(s);
let heatChart = null, routeChart = null;
let currentData = null;

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(t) {
  const d = new Date(t);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function relTime(t) {
  const diff = (Date.now() - new Date(t).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  return fmtTime(t).slice(5);
}

function countUp(el, target) {
  const start = Number(el.dataset.v || 0);
  if (start === target) return;
  const dur = 700, t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    el.dataset.v = String(target);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderMetrics(d) {
  countUp($id('mToday'), d.todayCheckins || 0);
  countUp($id('mTotal'), d.totalCheckins || 0);
  countUp($id('mUsers'), d.activeUsers || 0);
  $id('mPoints').innerHTML = (d.litPoints || 0) + '<small> / ' + (d.totalPoints || 0) + '</small>';
}

function renderFeed(list) {
  const box = $id('feed');
  if (!list || !list.length) { box.innerHTML = '<div class="feed-item"><div class="what">暂无打卡动态</div></div>'; return; }
  box.innerHTML = list.map((it) =>
    '<div class="feed-item">' +
      '<div class="who">' + esc(it.nickname) + '</div>' +
      '<div class="what">📍 ' + esc(it.pointName) + ' · 念出 <span class="spell">「' + esc(it.spell) + '」</span></div>' +
      '<div class="when">' + relTime(it.time) + '</div>' +
    '</div>'
  ).join('');
}

function renderRank(list) {
  const box = $id('rank');
  if (!list || !list.length) { box.innerHTML = '<div class="feed-item"><div class="what">暂无排行</div></div>'; return; }
  box.innerHTML = list.map((r) =>
    '<div class="rank-row ' + (r.rank <= 3 ? 'top3' : '') + '">' +
      '<div class="no">' + (r.rank <= 3 ? ['🥇','🥈','🥉'][r.rank - 1] : r.rank) + '</div>' +
      '<div class="name">' + esc(r.nickname) + '</div>' +
      '<div class="count">' + r.count + '</div>' +
      '<div class="unit">次</div>' +
    '</div>'
  ).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderHeat(heat) {
  const names = heat.map(h => h.name);
  const vals = heat.map(h => h.count);
  heatChart.setOption({
    grid: { left: 10, right: 24, top: 6, bottom: 6, containLabel: true },
    xAxis: { type: 'value', splitLine: { lineStyle: { color: 'rgba(74,144,217,0.12)' } }, axisLabel: { color: '#8FA8C4' } },
    yAxis: {
      type: 'category', data: names.slice().reverse(),
      axisLabel: { color: '#EAF2FA', fontSize: 12 },
      axisLine: { lineStyle: { color: 'rgba(74,144,217,0.3)' } }
    },
    series: [{
      type: 'bar',
      data: vals.slice().reverse(),
      barWidth: 12,
      itemStyle: {
        borderRadius: [0, 8, 8, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: 'rgba(74,144,217,0.35)' },
          { offset: 1, color: '#4A90D9' }
        ])
      },
      label: { show: true, position: 'right', color: '#7FC0FF', fontSize: 12 }
    }]
  }, true);
}

function renderRoute(rs) {
  routeChart.setOption({
    series: [{
      type: 'gauge',
      startAngle: 200, endAngle: -20,
      min: 0, max: 100,
      radius: '92%',
      center: ['50%', '58%'],
      progress: { show: true, width: 14, roundCap: true, itemStyle: { color: '#F5C26B' } },
      axisLine: { lineStyle: { width: 14, color: [[1, 'rgba(74,144,217,0.15)']] } },
      pointer: { show: false },
      axisTick: { show: false },
      splitLine: { show: false },
      axisLabel: { show: false },
      detail: {
        valueAnimation: true,
        fontSize: 30, fontWeight: 800,
        color: '#F5C26B',
        offsetCenter: [0, '38%'],
        formatter: '{value}%'
      },
      title: { show: true, offsetCenter: [0, '72%'], fontSize: 13, color: '#8FA8C4' },
      data: [{ value: rs.rate || 0, name: '通关率（通关 / 参与）' }]
    }]
  }, true);
}

// 云开发 Web SDK 匿名登录（兼容不同版本 API / 全局变量）
async function loadSDK() {
  const SDK = window.cloudbase || window.tcb;
  if (!SDK) { console.warn('CloudBase Web SDK 未加载（CDN 失败？）'); return null; }
  try {
    const app = SDK.init({ env: CLOUD_ENV });
    const auth = app.auth({ persistence: 'local' });
    // 旧版 tcb-js-sdk：signInAnonymously；新版：anonymousAuthProvider().signIn()
    if (typeof auth.signInAnonymously === 'function') {
      await auth.signInAnonymously();
    } else if (auth.anonymousAuthProvider) {
      await auth.anonymousAuthProvider().signIn();
    }
    const res = await app.callFunction({ name: 'getDashboardData' });
    const r = res && res.result;
    if (r && r.code === 0) return r;
    console.warn('getDashboardData 调用异常：', r);
    return null;
  } catch (e) {
    console.warn('Web SDK 拉取失败：', e);
    return null;
  }
}

async function load() {
  let data = null, isDemo = false, mode = '';
  data = await loadSDK();
  if (data) { mode = '实时数据'; }
  else { data = demo; isDemo = true; mode = '演示数据'; }

  currentData = data;
  const badge = $id('dataMode');
  badge.textContent = mode;
  badge.className = 'badge' + (isDemo ? ' demo' : '');
  $id('updateTime').textContent = fmtTime(data.generatedAt || Date.now()) + ' 更新';

  renderMetrics(data);
  renderFeed(data.recentCheckins);
  renderRank(data.rankingTop);
  if (heatChart) renderHeat(data.pointHeat);
  if (routeChart) renderRoute(data.routeStats || { rate: 0 });
}

// 初始化图表（窗口尺寸变化时自适应）
function initCharts() {
  heatChart = echarts.init($id('heatChart'));
  routeChart = echarts.init($id('routeChart'));
  window.addEventListener('resize', () => { heatChart.resize(); routeChart.resize(); });
}

initCharts();
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
